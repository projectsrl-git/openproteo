<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenProteo &mdash; standalone XML viewer</title>
<style>
  :root{--bg:#0d1117;--raise:#151b24;--panel:#1a2230;--line:#2b3648;--soft:#222c3c;
        --ink:#d8e1ec;--dim:#8593a8;--faint:#5a677c;--accent:#f5a623;--val:#58a6ff;--hitbg:#2e2410;
        --mono:Consolas,"Cascadia Mono","Courier New",monospace;
        --sans:"Segoe UI","Segoe UI Variable",Tahoma,sans-serif}
  :root[data-theme="light"]{--bg:#eef1f5;--raise:#ffffff;--panel:#f4f7fb;--line:#c9d2dd;--soft:#dde3ea;
        --ink:#1b2530;--dim:#51606f;--faint:#7b8794;--accent:#9a6100;--val:#0a5bd3;--hitbg:#fdf1cf}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .wrap{max-width:1400px;margin:0 auto;padding:16px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);margin:0 0 14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  button,.browse{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover,.browse:hover{border-color:var(--accent)}
  .browse input{display:none}
  input[type=text]{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:5px 8px;font-size:12px;min-width:280px;font-family:inherit}
  .dim{color:var(--dim)}
  .small{font-size:11.5px}
  .banner{border-radius:6px;padding:9px 12px;margin:10px 0;border:1px solid var(--line);background:var(--raise)}
  .banner.error{background:#2d1416;color:#f85149;border-color:#5c2a2a}
  :root[data-theme="light"] .banner.error{background:#ffe9e9;color:#cf222e;border-color:#e5a3a3}
  .drop{border:2px dashed var(--line);border-radius:8px;padding:34px;text-align:center;color:var(--dim);margin-top:16px}
  .drop.drag{border-color:var(--accent);color:var(--ink)}
  .xt-wrap{max-height:72vh}

.xt-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: auto; background: var(--bg); padding: 6px; }
.xt-block { margin: 0 0 8px 0; }
.xt-kids { margin: 6px 0 0 18px; border-left: 2px solid var(--soft); padding-left: 10px; }
.xt-head { display: flex; align-items: center; gap: 7px; padding: 6px 9px;
           background: #31435f; border: 1px solid var(--line); border-left: 4px solid var(--accent);
           border-radius: 5px 5px 0 0; font-family: var(--mono); font-size: 12.5px;
           letter-spacing: .2px; }
.xt-head:hover { background: #3b4f70; }
.xt-tog { display: inline-block; width: 10px; color: var(--faint); flex: 0 0 auto; }
.xt-tog-btn { cursor: pointer; }
.xt-tag { color: var(--accent); font-weight: 600; }
.xt-comment { color: var(--faint); font-style: italic; }
.xt-count { margin-left: auto; color: var(--faint); background: var(--soft);
            border-radius: 8px; padding: 0 7px; font-size: 10.5px; }
.xt-tbl { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px;
          border: 1px solid var(--line); border-top: 0; background: var(--bg); }
.xt-tbl th { text-align: left; padding: 6px 8px; background: #3b5178; color: #eef3fb;
             font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .4px;
             border-right: 1px solid var(--line); border-bottom: 2px solid var(--accent);
             white-space: nowrap; position: sticky; top: 0; }
.xt-tbl td { padding: 3px 8px; border-right: 1px solid var(--soft);
             border-bottom: 1px solid var(--soft); vertical-align: top; word-break: break-word; }
.xt-tbl tbody tr:nth-child(even) > td { background: var(--raise); }
.xt-tbl tbody tr:hover > td { background: var(--panel); }
.xt-kv td.xt-k { color: #a9b8cc; white-space: nowrap; width: 1%;
                 background: #1b2534; font-weight: 600; }
.xt-tbl td.xt-v { color: var(--val); }
.xt-tbl td.xt-null { background: repeating-linear-gradient(45deg, transparent, transparent 4px, var(--soft) 4px, var(--soft) 5px); }
.xt-tbl td.xt-num, .xt-tbl th.xt-num { color: var(--faint); width: 1%; text-align: right; white-space: nowrap; }
.xt-tbl tr.xt-sub > td { background: var(--bg); padding: 8px 8px 8px 18px; }
.xt-text { padding: 5px 8px; border: 1px solid var(--line); border-top: 0; background: var(--bg);
           color: var(--ink); font-family: var(--mono); font-size: 12px;
           white-space: pre-wrap; word-break: break-word; }
.xt-wrap mark { background: var(--accent); color: #1b2530; border-radius: 2px; padding: 0 1px; }
.xt-empty { padding: 14px; color: var(--dim); }
:root[data-theme="light"] .xt-head { background: #bcd3ec; }
:root[data-theme="light"] .xt-head:hover { background: #aac7e6; }
:root[data-theme="light"] .xt-tbl th { background: #a5c4e6; color: #16283c; }
:root[data-theme="light"] .xt-tbl tbody tr:nth-child(even) > td { background: #f7f9fc; }
:root[data-theme="light"] .xt-tbl tbody tr:hover > td { background: #eef3fa; }
:root[data-theme="light"] .xt-kv td.xt-k { background: #e7eef7; color: #3d4d61; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" style="justify-content:space-between">
    <div>
      <h1>OpenProteo &mdash; standalone XML viewer</h1>
      <p class="sub small">Everything runs in this page: no upload, no network, no external library. The file never leaves your machine.</p>
    </div>
    <button id="themeBtn">&#9788; light</button>
  </div>

  <div class="bar">
    <label class="browse">Browse&hellip;<input type="file" id="xmlFile" accept=".xml,.xsd,.wsdl,.svg,.config,.txt"></label>
    <span id="fileName" class="dim small">no file</span>
  </div>

  <div id="msg" class="banner">Choose an XML file, or drag one anywhere on this page.</div>

  <div id="tabs" class="tabs" style="display:none">
    <button class="tab active" id="tabTree">Table</button>
    <button class="tab" id="tabCode">Code</button>
  </div>

  <div id="treePane" style="display:none">
    <div class="bar">
      <input type="text" id="q" placeholder="search tags, attributes, values&hellip;">
      <span id="qinfo" class="dim small"></span>
      <button id="expandAll">Expand all</button>
      <button id="collapseAll">Collapse all</button>
    </div>
    <div id="tree" class="xt-wrap"></div>
  </div>

  <div id="codePane" style="display:none"><pre class="code" id="code"></pre></div>

  <div id="drop" class="drop">&hellip;or drag &amp; drop an XML file here</div>
</div>

<script>
(function () {
  var NL = String.fromCharCode(10);
  function $(id) { return document.getElementById(id); }

  // theme
  try { var t = localStorage.getItem('opv-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  function refreshTheme() {
    var lt = document.documentElement.getAttribute('data-theme') === 'light';
    $('themeBtn').innerHTML = lt ? (String.fromCharCode(0x263E) + ' dark') : (String.fromCharCode(0x2600) + ' light');
  }
  $('themeBtn').onclick = function () {
    var lt = document.documentElement.getAttribute('data-theme') === 'light';
    if (lt) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('opv-theme', lt ? 'dark' : 'light'); } catch (e) {}
    refreshTheme();
  };
  refreshTheme();

    /* ===================== XML table view (shared) =====================
       Renders XML as TABLES, not as an indented tree:
         - a single element becomes a titled block with an Attribute | Value table;
         - a run of sibling elements with the SAME tag becomes ONE table whose header is the
           union of their attribute names, one row per element - which is what a list of <Obs>
           or <var> actually is;
         - an element that has children of its own gets a toggle that opens its block below.
       A lightweight model is built up front (cheap: references plus a lowercase haystack) and the
       DOM is rendered from it lazily, so a megabyte-sized document does not build tens of thousands
       of cells before the first paint. Search runs on the model, so it finds matches inside branches
       that have never been rendered.
       Newlines are built with String.fromCharCode: literal escapes are rewritten by the proxy. */
    function xmlTreeEsc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function xmlTreeMark(s, q) {
        s = String(s == null ? '' : s);
        if (!q) return xmlTreeEsc(s);
        var lo = s.toLowerCase(), ql = q.toLowerCase(), out = '', from = 0, p;
        while ((p = lo.indexOf(ql, from)) >= 0) {
            out += xmlTreeEsc(s.substring(from, p)) + '<mark>' + xmlTreeEsc(s.substr(p, ql.length)) + '</mark>';
            from = p + ql.length;
        }
        return out + xmlTreeEsc(s.substring(from));
    }

    /** Model: one record per element (and per comment), with its own searchable haystack. */
    function xmlBuildModel(doc) {
        var all = [];
        function walk(node, parent, depth) {
            var isComment = (node.nodeType === 8);
            var m = { tag: isComment ? '#comment' : node.nodeName, comment: isComment,
                      attrs: [], text: '', children: [], parent: parent, depth: depth, idx: all.length };
            all.push(m);
            if (isComment) {
                m.text = String(node.nodeValue || '').replace(/^\s+|\s+$/g, '');
            } else {
                for (var a = 0; a < node.attributes.length; a++) {
                    m.attrs.push({ n: node.attributes[a].name, v: node.attributes[a].value });
                }
                var buf = '', kids = [];
                for (var i = 0; i < node.childNodes.length; i++) {
                    var c = node.childNodes[i];
                    if (c.nodeType === 1 || c.nodeType === 8) kids.push(c);
                    else if (c.nodeType === 3 || c.nodeType === 4) buf += c.nodeValue;
                }
                m.text = buf.replace(/^\s+|\s+$/g, '');
                for (var k = 0; k < kids.length; k++) m.children.push(walk(kids[k], m, depth + 1));
            }
            var hay = m.tag;
            for (var x = 0; x < m.attrs.length; x++) hay += ' ' + m.attrs[x].n + ' ' + m.attrs[x].v;
            m.hay = (hay + ' ' + m.text).toLowerCase();
            return m;
        }
        return { root: walk(doc.documentElement, null, 0), all: all };
    }

    /** Consecutive siblings sharing a tag form one run; order is never rearranged. */
    function xmlRuns(children) {
        var runs = [], cur = null;
        for (var i = 0; i < children.length; i++) {
            var c = children[i];
            if (cur && cur.tag === c.tag && !c.comment) cur.items.push(c);
            else { cur = { tag: c.tag, items: [c] }; runs.push(cur); }
        }
        return runs;
    }
    /** Header of a run's table: every attribute name in first-seen order, plus a value column if used. */
    function xmlRunColumns(items) {
        var cols = [], seen = {}, hasText = false;
        for (var i = 0; i < items.length; i++) {
            for (var a = 0; a < items[i].attrs.length; a++) {
                var n = items[i].attrs[a].n;
                if (!seen[n]) { seen[n] = 1; cols.push(n); }
            }
            if (items[i].text) hasText = true;
        }
        return { cols: cols, hasText: hasText };
    }
    function xmlAttrValue(m, name) {
        for (var i = 0; i < m.attrs.length; i++) if (m.attrs[i].n === name) return m.attrs[i].v;
        return null;
    }

    /**
     * Renders into host. Returns { count, expandAll, collapseAll, search }.
     * search(q) re-renders showing only matching elements and the ancestors that lead to them.
     */
    function buildXmlTree(host, doc) {
        host.innerHTML = '';
        if (!doc || !doc.documentElement) { host.innerHTML = '<div class="xt-empty">empty document</div>'; return null; }
        var model = xmlBuildModel(doc);
        var query = '', keep = null;            // keep = null means "no filter"
        var openSet = {};                       // idx -> true when the element's children are shown
        openSet[model.root.idx] = true;

        function visible(m) { return !keep || keep[m.idx]; }

        function el2(tag, cls, parent) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (parent) parent.appendChild(e);
            return e;
        }

        /** A single element: title band, its own Attribute | Value table, its text, then its children. */
        function renderBlock(m, into, depth) {
            var block = el2('div', 'xt-block', into);
            var head = el2('div', 'xt-head', block);
            var hasKids = m.children.length > 0;
            var tog = el2('span', 'xt-tog', head);
            tog.textContent = hasKids ? (openSet[m.idx] ? String.fromCharCode(0x25BE) : String.fromCharCode(0x25B8)) : '';
            var tg = el2('span', m.comment ? 'xt-comment' : 'xt-tag', head);
            tg.innerHTML = xmlTreeMark(m.tag, query);
            if (hasKids) {
                var badge = el2('span', 'xt-count', head);
                badge.textContent = m.children.length + (m.children.length === 1 ? ' child' : ' children');
                head.style.cursor = 'pointer';
                head.addEventListener('click', function () {
                    openSet[m.idx] = !openSet[m.idx];
                    draw();
                });
            }
            if (m.attrs.length) {
                var t = el2('table', 'xt-tbl xt-kv', block);
                var tb = el2('tbody', null, t);
                for (var i = 0; i < m.attrs.length; i++) {
                    var tr = el2('tr', null, tb);
                    var td1 = el2('td', 'xt-k', tr); td1.innerHTML = xmlTreeMark(m.attrs[i].n, query);
                    var td2 = el2('td', 'xt-v', tr); td2.innerHTML = xmlTreeMark(m.attrs[i].v, query);
                }
            }
            if (m.text) {
                var tt = el2('div', 'xt-text', block);
                tt.innerHTML = xmlTreeMark(m.text, query);
            }
            if (hasKids && openSet[m.idx]) {
                var kidsBox = el2('div', 'xt-kids', block);
                renderChildren(m, kidsBox, depth + 1);
            }
            return block;
        }

        /** Children grouped into runs: >1 of the same tag becomes one table with a header. */
        function renderChildren(m, into, depth) {
            var kids = [];
            for (var i = 0; i < m.children.length; i++) if (visible(m.children[i])) kids.push(m.children[i]);
            var runs = xmlRuns(kids);
            for (var r = 0; r < runs.length; r++) {
                var run = runs[r];
                if (run.items.length === 1) { renderBlock(run.items[0], into, depth); continue; }
                renderRunTable(run, into, depth);
            }
        }

        function renderRunTable(run, into, depth) {
            var spec = xmlRunColumns(run.items);
            var wrap = el2('div', 'xt-block', into);
            var head = el2('div', 'xt-head', wrap);
            el2('span', 'xt-tog', head);
            var tg = el2('span', 'xt-tag', head);
            tg.innerHTML = xmlTreeMark(run.tag, query);
            var badge = el2('span', 'xt-count', head);
            badge.textContent = run.items.length + ' items';

            var table = el2('table', 'xt-tbl xt-list', wrap);
            var thead = el2('thead', null, table);
            var hr = el2('tr', null, thead);
            var anyKids = false;
            for (var q = 0; q < run.items.length; q++) if (run.items[q].children.length) anyKids = true;
            if (anyKids) el2('th', 'xt-num', hr).textContent = '';
            el2('th', 'xt-num', hr).textContent = '#';
            for (var c = 0; c < spec.cols.length; c++) {
                var th = el2('th', null, hr);
                th.innerHTML = xmlTreeMark(spec.cols[c], query);
            }
            if (spec.hasText) el2('th', null, hr).textContent = 'value';

            var tbody = el2('tbody', null, table);
            for (var i = 0; i < run.items.length; i++) {
                (function (it, rowNo) {
                    var tr = el2('tr', null, tbody);
                    if (anyKids) {
                        var tdT = el2('td', 'xt-num', tr);
                        if (it.children.length) {
                            var b = el2('span', 'xt-tog xt-tog-btn', tdT);
                            b.textContent = openSet[it.idx] ? String.fromCharCode(0x25BE) : String.fromCharCode(0x25B8);
                            tdT.style.cursor = 'pointer';
                            tdT.addEventListener('click', function () { openSet[it.idx] = !openSet[it.idx]; draw(); });
                        }
                    }
                    el2('td', 'xt-num', tr).textContent = String(rowNo);
                    for (var c2 = 0; c2 < spec.cols.length; c2++) {
                        var v = xmlAttrValue(it, spec.cols[c2]);
                        var td = el2('td', v == null ? 'xt-v xt-null' : 'xt-v', tr);
                        if (v == null) td.textContent = '';
                        else td.innerHTML = xmlTreeMark(v, query);
                    }
                    if (spec.hasText) {
                        var tdx = el2('td', 'xt-v', tr);
                        tdx.innerHTML = xmlTreeMark(it.text, query);
                    }
                    if (it.children.length && openSet[it.idx]) {
                        var sub = el2('tr', 'xt-sub', tbody);
                        var cell = el2('td', null, sub);
                        cell.colSpan = (anyKids ? 1 : 0) + 1 + spec.cols.length + (spec.hasText ? 1 : 0);
                        renderChildren(it, cell, depth + 1);
                    }
                })(run.items[i], i + 1);
            }
        }

        function draw() {
            host.innerHTML = '';
            if (keep && !keep[model.root.idx]) { host.innerHTML = '<div class="xt-empty">no match</div>'; return; }
            renderBlock(model.root, host, 0);
        }

        function search(q) {
            query = (q || '').trim();
            if (!query) { keep = null; draw(); return 0; }
            var ql = query.toLowerCase(), hits = 0;
            keep = [];
            for (var i = 0; i < model.all.length; i++) {
                var m = model.all[i].hay.indexOf(ql) >= 0;
                keep[i] = m;
                if (m) hits++;
            }
            // keep the path to every match, and open it, so a hit is never inside a closed element
            for (var k = model.all.length - 1; k >= 0; k--) {
                if (!keep[k]) continue;
                var p = model.all[k].parent;
                while (p) { keep[p.idx] = true; openSet[p.idx] = true; p = p.parent; }
                openSet[model.all[k].idx] = true;
            }
            draw();
            return hits;
        }

        draw();
        return {
            count: model.all.length,
            expandAll: function () { for (var i = 0; i < model.all.length; i++) openSet[model.all[i].idx] = true; draw(); },
            collapseAll: function () { openSet = {}; openSet[model.root.idx] = true; draw(); },
            search: search
        };
    }

  // ---- pretty printer for the Code tab (same shape as the in-app viewer) ----
  function formatXmlStr(s) {
    var doc;
    try { doc = new DOMParser().parseFromString(s, 'application/xml'); } catch (e) { return null; }
    if (!doc || !doc.documentElement) return null;
    if (doc.getElementsByTagName('parsererror').length) return null;
    function ea(v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
    function et(v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function ser(node, depth) {
      var pad = ''; for (var i = 0; i < depth; i++) pad += '  ';
      if (node.nodeType === 3) { var x = node.nodeValue.replace(/^\s+|\s+$/g, ''); return x ? pad + et(x) + NL : ''; }
      if (node.nodeType === 8) return pad + '<!--' + node.nodeValue + '-->' + NL;
      if (node.nodeType !== 1) return '';
      var tag = node.nodeName, attrs = '';
      for (var a = 0; a < node.attributes.length; a++) attrs += ' ' + node.attributes[a].name + '="' + ea(node.attributes[a].value) + '"';
      var kids = node.childNodes, ek = 0, tb = '';
      for (var k = 0; k < kids.length; k++) { if (kids[k].nodeType === 1) ek++; else if (kids[k].nodeType === 3) tb += kids[k].nodeValue; }
      if (kids.length === 0) return pad + '<' + tag + attrs + '/>' + NL;
      if (ek === 0) return pad + '<' + tag + attrs + '>' + et(tb.replace(/^\s+|\s+$/g, '')) + '</' + tag + '>' + NL;
      var inner = '';
      for (var c = 0; c < kids.length; c++) inner += ser(kids[c], depth + 1);
      return pad + '<' + tag + attrs + '>' + NL + inner + pad + '</' + tag + '>' + NL;
    }
    return ('<?xml version="1.0" encoding="UTF-8"?>' + NL + ser(doc.documentElement, 0)).replace(/\s+$/, '');
  }

  var api = null;
  function show(kind) {
    var tree = (kind === 'tree');
    $('tabTree').classList.toggle('active', tree);
    $('tabCode').classList.toggle('active', !tree);
    $('treePane').style.display = tree ? '' : 'none';
    $('codePane').style.display = tree ? 'none' : '';
  }
  $('tabTree').onclick = function () { show('tree'); };
  $('tabCode').onclick = function () { show('code'); };
  $('expandAll').onclick = function () { if (api) api.expandAll(); };
  $('collapseAll').onclick = function () { if (api) api.collapseAll(); };
  $('q').addEventListener('input', function () {
    if (!api) return;
    var v = $('q').value, n = api.search(v);
    $('qinfo').textContent = v.trim() ? (n + ' match' + (n === 1 ? '' : 'es')) : (api.count + ' elements');
  });

  function load(fileText, fileNameStr) {
    $('fileName').textContent = fileNameStr;
    var doc = null;
    try { doc = new DOMParser().parseFromString(fileText, 'application/xml'); } catch (e) { doc = null; }
    var bad = !doc || !doc.documentElement || doc.getElementsByTagName('parsererror').length > 0;
    $('code').textContent = bad ? fileText : (formatXmlStr(fileText) || fileText);
    $('tabs').style.display = 'flex';
    $('drop').style.display = 'none';
    if (bad) {
      var m = $('msg');
      m.className = 'banner error';
      m.textContent = 'This file is not well-formed XML, so there is no table to show. It is displayed as it is under Code.';
      m.style.display = '';
      api = null;
      $('tree').innerHTML = '';
      show('code');
      return;
    }
    $('msg').style.display = 'none';
    api = buildXmlTree($('tree'), doc);
    $('q').value = '';
    $('qinfo').textContent = api ? (api.count + ' elements') : '';
    show('tree');
  }

  function readFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { load(String(r.result), f.name + '  (' + f.size + ' bytes)'); };
    r.onerror = function () {
      var m = $('msg'); m.className = 'banner error'; m.style.display = '';
      m.textContent = 'Could not read the file.';
    };
    r.readAsText(f, 'UTF-8');
  }
  $('xmlFile').addEventListener('change', function (e) { readFile(e.target.files[0]); });

  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
  });
  document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) drop.classList.remove('drag'); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); drop.classList.remove('drag');
