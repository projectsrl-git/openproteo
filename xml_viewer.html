<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenProteo &mdash; standalone XML viewer</title>
<style>
  :root{--bg:#0d1117;--raise:#151b24;--panel:#1a2230;--line:#2b3648;--soft:#222c3c;
        --ink:#d8e1ec;--dim:#8593a8;--faint:#5a677c;--accent:#f5a623;--val:#58a6ff;--hitbg:#2e2410;
        --mono:Consolas,"Cascadia Mono","Courier New",monospace;
        --sans:"Segoe UI","Segoe UI Variable",Tahoma,sans-serif}
  :root[data-theme="light"]{--bg:#eef1f5;--raise:#ffffff;--panel:#f4f7fb;--line:#c9d2dd;--soft:#dde3ea;
        --ink:#1b2530;--dim:#51606f;--faint:#7b8794;--accent:#9a6100;--val:#0a5bd3;--hitbg:#fdf1cf}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .wrap{max-width:1400px;margin:0 auto;padding:16px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);margin:0 0 14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  button,.browse{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover,.browse:hover{border-color:var(--accent)}
  .browse input{display:none}
  input[type=text]{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:5px 8px;font-size:12px;min-width:280px;font-family:inherit}
  .dim{color:var(--dim)}
  .small{font-size:11.5px}
  .banner{border-radius:6px;padding:9px 12px;margin:10px 0;border:1px solid var(--line);background:var(--raise)}
  .banner.error{background:#2d1416;color:#f85149;border-color:#5c2a2a}
  :root[data-theme="light"] .banner.error{background:#ffe9e9;color:#cf222e;border-color:#e5a3a3}
  .drop{border:2px dashed var(--line);border-radius:8px;padding:34px;text-align:center;color:var(--dim);margin-top:16px}
  .drop.drag{border-color:var(--accent);color:var(--ink)}
  .xt-wrap{max-height:72vh}
  pre.code{margin:0;padding:10px;overflow:auto;max-height:72vh;background:var(--raise);
    border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12px;line-height:18px}
  .tabs{display:flex;gap:4px;margin:10px 0 8px}
  .tab{background:transparent;border:1px solid var(--line);border-bottom-color:transparent;border-radius:5px 5px 0 0}
  .tab.active{background:var(--raise);border-bottom-color:var(--raise);color:var(--accent)}

.xt-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: auto; background: var(--bg); }
.xt-node { border-left: 1px solid transparent; }
.xt-node.xt-closed > .xt-kids, .xt-node.xt-closed > .xt-text { display: none; }
.xt-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; padding: 3px 8px 3px 6px;
           background: var(--raise); border-bottom: 1px solid var(--soft);
           font-family: var(--mono); font-size: 12px; line-height: 18px; }
.xt-head:hover { background: var(--panel); }
.xt-tog { display: inline-block; width: 10px; color: var(--faint); flex: 0 0 auto; }
.xt-tag { color: var(--accent); font-weight: 600; }
.xt-comment { color: var(--faint); font-style: italic; }
.xt-attr { color: var(--dim); white-space: nowrap; }
.xt-attr b { color: var(--dim); font-weight: 400; }
.xt-attr em { color: var(--val); font-style: normal; }
.xt-count { margin-left: auto; color: var(--faint); background: var(--soft);
            border-radius: 8px; padding: 0 6px; font-size: 10.5px; }
.xt-text { background: var(--bg); color: var(--ink); border-bottom: 1px solid var(--soft);
           padding: 4px 8px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
           word-break: break-word; }
.xt-head.xt-hit { background: var(--hitbg); }
.xt-wrap mark { background: var(--accent); color: #1b2530; border-radius: 2px; padding: 0 1px; }
.xt-empty { padding: 14px; color: var(--dim); }
:root[data-theme="light"] .xt-head { background: #f4f7fb; }
:root[data-theme="light"] .xt-head:hover { background: #eaf0f8; }
:root[data-theme="light"] .xt-text { background: #ffffff; }
:root[data-theme="light"] .xt-head.xt-hit { background: #fdf1cf; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" style="justify-content:space-between">
    <div>
      <h1>OpenProteo &mdash; standalone XML viewer</h1>
      <p class="sub small">Everything runs in this page: no upload, no network, no external library. The file never leaves your machine.</p>
    </div>
    <button id="themeBtn">&#9788; light</button>
  </div>

  <div class="bar">
    <label class="browse">Browse&hellip;<input type="file" id="xmlFile" accept=".xml,.xsd,.wsdl,.svg,.config,.txt"></label>
    <span id="fileName" class="dim small">no file</span>
  </div>

  <div id="msg" class="banner">Choose an XML file, or drag one anywhere on this page.</div>

  <div id="tabs" class="tabs" style="display:none">
    <button class="tab active" id="tabTree">Tree</button>
    <button class="tab" id="tabCode">Code</button>
  </div>

  <div id="treePane" style="display:none">
    <div class="bar">
      <input type="text" id="q" placeholder="search tags, attributes, text&hellip;">
      <span id="qinfo" class="dim small"></span>
      <button id="expandAll">Expand all</button>
      <button id="collapseAll">Collapse all</button>
    </div>
    <div id="tree" class="xt-wrap"></div>
  </div>

  <div id="codePane" style="display:none"><pre class="code" id="code"></pre></div>

  <div id="drop" class="drop">&hellip;or drag &amp; drop an XML file here</div>
</div>

<script>
(function () {
  var NL = String.fromCharCode(10);
  function $(id) { return document.getElementById(id); }

  // theme
  try { var t = localStorage.getItem('opv-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  function refreshTheme() {
    var lt = document.documentElement.getAttribute('data-theme') === 'light';
    $('themeBtn').innerHTML = lt ? (String.fromCharCode(0x263E) + ' dark') : (String.fromCharCode(0x2600) + ' light');
  }
  $('themeBtn').onclick = function () {
    var lt = document.documentElement.getAttribute('data-theme') === 'light';
    if (lt) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('opv-theme', lt ? 'dark' : 'light'); } catch (e) {}
    refreshTheme();
  };
  refreshTheme();

    /* ===================== XML tree view (shared) =====================
       Renders a parsed XML document as collapsible rows. Element headers and text
       content get different backgrounds; every colour comes from a theme variable so
       light and dark both work without a second stylesheet.
       Newlines are built with String.fromCharCode: literal escapes in JS source are
       rewritten by the corporate proxy. */
    function xmlTreeEsc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    /** Escaped HTML with every case-insensitive occurrence of q wrapped in <mark>. */
    function xmlTreeMark(s, q) {
        s = String(s == null ? '' : s);
        if (!q) return xmlTreeEsc(s);
        var lo = s.toLowerCase(), ql = q.toLowerCase(), out = '', from = 0, p;
        while ((p = lo.indexOf(ql, from)) >= 0) {
            out += xmlTreeEsc(s.substring(from, p)) + '<mark>' + xmlTreeEsc(s.substr(p, ql.length)) + '</mark>';
            from = p + ql.length;
        }
        return out + xmlTreeEsc(s.substring(from));
    }

    /**
     * Builds the tree into host. Returns { expandAll, collapseAll, search, count }.
     * search(q) re-renders the labels with highlights, hides subtrees with no match,
     * opens the ancestors of every match, and returns how many nodes matched.
     */
    function buildXmlTree(host, doc) {
        host.innerHTML = '';
        var nodes = [];                       // flat list of {el, head, kids, tagSpan, attrSpans, textSpan, hay, parent}
        var root = doc && doc.documentElement;
        if (!root) { host.innerHTML = '<div class="xt-empty">empty document</div>'; return null; }

        function walk(node, parent, depth, into) {
            var kidsEls = [], textBuf = '';
            for (var i = 0; i < node.childNodes.length; i++) {
                var c = node.childNodes[i];
                if (c.nodeType === 1) kidsEls.push(c);
                else if (c.nodeType === 3 || c.nodeType === 4) textBuf += c.nodeValue;
                else if (c.nodeType === 8) kidsEls.push(c);
            }
            var wrap = document.createElement('div');
            wrap.className = 'xt-node';
            var head = document.createElement('div');
            head.className = 'xt-head';
            head.style.paddingLeft = (6 + depth * 16) + 'px';
            wrap.appendChild(head);

            var isComment = (node.nodeType === 8);
            var tog = document.createElement('span');
            tog.className = 'xt-tog';
            head.appendChild(tog);

            var tagSpan = document.createElement('span');
            tagSpan.className = isComment ? 'xt-comment' : 'xt-tag';
            head.appendChild(tagSpan);

            var rec = { wrap: wrap, head: head, tog: tog, depth: depth, parent: parent,
                        tagRaw: isComment ? '<!-- comment -->' : node.nodeName,
                        attrs: [], textRaw: '', tagSpan: tagSpan, attrSpans: [], textSpan: null,
                        kidsBox: null, hasKids: false };

            if (!isComment) {
                for (var a = 0; a < node.attributes.length; a++) {
                    var at = node.attributes[a];
                    var sp = document.createElement('span');
                    sp.className = 'xt-attr';
                    head.appendChild(sp);
                    rec.attrs.push({ name: at.name, value: at.value });
                    rec.attrSpans.push(sp);
                }
            }

            var trimmed = isComment ? String(node.nodeValue || '').replace(/^\s+|\s+$/g, '')
                                    : textBuf.replace(/^\s+|\s+$/g, '');
            if (trimmed) {
                var tx = document.createElement('div');
                tx.className = 'xt-text';
                tx.style.paddingLeft = (6 + (depth + 1) * 16) + 'px';
                wrap.appendChild(tx);
                rec.textRaw = trimmed;
                rec.textSpan = tx;
            }

            if (kidsEls.length) {
                var box = document.createElement('div');
                box.className = 'xt-kids';
                wrap.appendChild(box);
                rec.kidsBox = box;
                rec.hasKids = true;
                var badge = document.createElement('span');
                badge.className = 'xt-count';
                badge.textContent = String(kidsEls.length);
                head.appendChild(badge);
            }

            rec.hay = (rec.tagRaw + ' ' + rec.attrs.map(function (x) { return x.name + '=' + x.value; }).join(' ')
                       + ' ' + rec.textRaw).toLowerCase();
            rec.idx = nodes.length;          // own position, so ancestor marking stays linear
            nodes.push(rec);
            into.appendChild(wrap);

            if (rec.hasKids) {
                for (var k = 0; k < kidsEls.length; k++) walk(kidsEls[k], rec, depth + 1, rec.kidsBox);
                head.style.cursor = 'pointer';
                head.addEventListener('click', function (r) {
                    return function (e) {
                        if (e && e.target && e.target.tagName === 'MARK') { /* still toggles */ }
                        setOpen(r, r.wrap.classList.contains('xt-closed'));
                    };
                }(rec));
            }
            return rec;
        }

        function setOpen(rec, open) {
            if (!rec.hasKids) return;
            if (open) rec.wrap.classList.remove('xt-closed');
            else rec.wrap.classList.add('xt-closed');
            rec.tog.textContent = open ? String.fromCharCode(0x25BE) : String.fromCharCode(0x25B8);
        }

        walk(root, null, 0, host);
        for (var i = 0; i < nodes.length; i++) { if (nodes[i].hasKids) setOpen(nodes[i], true); }

        function paint(q) {
            for (var i = 0; i < nodes.length; i++) {
                var r = nodes[i];
                r.tagSpan.innerHTML = xmlTreeMark(r.tagRaw, q);
                for (var a = 0; a < r.attrs.length; a++) {
                    r.attrSpans[a].innerHTML = '<b>' + xmlTreeMark(r.attrs[a].name, q) + '</b>='
                        + '<em>' + xmlTreeMark(r.attrs[a].value, q) + '</em>';
                }
                if (r.textSpan) r.textSpan.innerHTML = xmlTreeMark(r.textRaw, q);
            }
        }

        paint('');        // labels are written by paint(): without this first call the tree renders blank

        function search(q) {
            q = (q || '').trim();
            paint(q);
            if (!q) {
                for (var i = 0; i < nodes.length; i++) {
                    nodes[i].wrap.style.display = '';
                    nodes[i].head.classList.remove('xt-hit');
                }
                return 0;
            }
            var ql = q.toLowerCase(), hits = 0, keep = [];
            for (var j = 0; j < nodes.length; j++) {
                var r = nodes[j], m = r.hay.indexOf(ql) >= 0;
                keep[j] = m;
                if (m) hits++;
                if (m) r.head.classList.add('xt-hit'); else r.head.classList.remove('xt-hit');
            }
            // a node stays visible when it matches or has a visible descendant: walk backwards so
            // children are resolved before their parent
            for (var k = nodes.length - 1; k >= 0; k--) {
                if (!keep[k]) continue;
                var p = nodes[k].parent;
                while (p && !keep[p.idx]) { keep[p.idx] = true; p = p.parent; }
            }
            for (var z = 0; z < nodes.length; z++) {
                nodes[z].wrap.style.display = keep[z] ? '' : 'none';
                if (keep[z] && nodes[z].hasKids) setOpen(nodes[z], true);
            }
            return hits;
        }

        return {
            count: nodes.length,
            expandAll: function () { for (var i = 0; i < nodes.length; i++) setOpen(nodes[i], true); },
            collapseAll: function () { for (var i = 0; i < nodes.length; i++) if (nodes[i].depth > 0) setOpen(nodes[i], false); },
            search: search
        };
    }

  // ---- pretty printer for the Code tab (same shape as the in-app viewer) ----
  function formatXmlStr(s) {
    var doc;
    try { doc = new DOMParser().parseFromString(s, 'application/xml'); } catch (e) { return null; }
    if (!doc || !doc.documentElement) return null;
    if (doc.getElementsByTagName('parsererror').length) return null;
    function ea(v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
    function et(v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function ser(node, depth) {
      var pad = ''; for (var i = 0; i < depth; i++) pad += '  ';
      if (node.nodeType === 3) { var x = node.nodeValue.replace(/^\s+|\s+$/g, ''); return x ? pad + et(x) + NL : ''; }
      if (node.nodeType === 8) return pad + '<!--' + node.nodeValue + '-->' + NL;
      if (node.nodeType !== 1) return '';
      var tag = node.nodeName, attrs = '';
      for (var a = 0; a < node.attributes.length; a++) attrs += ' ' + node.attributes[a].name + '="' + ea(node.attributes[a].value) + '"';
      var kids = node.childNodes, ek = 0, tb = '';
      for (var k = 0; k < kids.length; k++) { if (kids[k].nodeType === 1) ek++; else if (kids[k].nodeType === 3) tb += kids[k].nodeValue; }
      if (kids.length === 0) return pad + '<' + tag + attrs + '/>' + NL;
      if (ek === 0) return pad + '<' + tag + attrs + '>' + et(tb.replace(/^\s+|\s+$/g, '')) + '</' + tag + '>' + NL;
      var inner = '';
      for (var c = 0; c < kids.length; c++) inner += ser(kids[c], depth + 1);
      return pad + '<' + tag + attrs + '>' + NL + inner + pad + '</' + tag + '>' + NL;
    }
    return ('<?xml version="1.0" encoding="UTF-8"?>' + NL + ser(doc.documentElement, 0)).replace(/\s+$/, '');
  }

  var api = null;
  function show(kind) {
    var tree = (kind === 'tree');
    $('tabTree').classList.toggle('active', tree);
    $('tabCode').classList.toggle('active', !tree);
    $('treePane').style.display = tree ? '' : 'none';
    $('codePane').style.display = tree ? 'none' : '';
  }
  $('tabTree').onclick = function () { show('tree'); };
  $('tabCode').onclick = function () { show('code'); };
  $('expandAll').onclick = function () { if (api) api.expandAll(); };
  $('collapseAll').onclick = function () { if (api) api.collapseAll(); };
  $('q').addEventListener('input', function () {
    if (!api) return;
    var v = $('q').value, n = api.search(v);
    $('qinfo').textContent = v.trim() ? (n + ' match' + (n === 1 ? '' : 'es')) : (api.count + ' elements');
  });

  function load(fileText, fileNameStr) {
    $('fileName').textContent = fileNameStr;
    var doc = null;
    try { doc = new DOMParser().parseFromString(fileText, 'application/xml'); } catch (e) { doc = null; }
    var bad = !doc || !doc.documentElement || doc.getElementsByTagName('parsererror').length > 0;
    $('code').textContent = bad ? fileText : (formatXmlStr(fileText) || fileText);
    $('tabs').style.display = 'flex';
    $('drop').style.display = 'none';
    if (bad) {
      var m = $('msg');
      m.className = 'banner error';
      m.textContent = 'This file is not well-formed XML, so there is no tree to show. It is displayed as it is under Code.';
      m.style.display = '';
      api = null;
      $('tree').innerHTML = '';
      show('code');
      return;
    }
    $('msg').style.display = 'none';
    api = buildXmlTree($('tree'), doc);
    $('q').value = '';
    $('qinfo').textContent = api ? (api.count + ' elements') : '';
    show('tree');
  }

  function readFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { load(String(r.result), f.name + '  (' + f.size + ' bytes)'); };
    r.onerror = function () {
      var m = $('msg'); m.className = 'banner error'; m.style.display = '';
      m.textContent = 'Could not read the file.';
    };
    r.readAsText(f, 'UTF-8');
  }
  $('xmlFile').addEventListener('change', function (e) { readFile(e.target.files[0]); });

  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
  });
  document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) drop.classList.remove('drag'); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); drop.classList.remove('drag');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
  });
})();
</script>
</body>
</html>
