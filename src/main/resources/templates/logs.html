<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenProteo — Log report</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css(v=${buildId})}">
    <script>(function(){try{var t=localStorage.getItem("op-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <style>
        .lgbar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
        .lgf { display: flex; flex-direction: column; gap: 3px; }
        .lgf label { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--label); }
        .lgf select, .lgf input { background: var(--bg); color: var(--ink); border: 1px solid var(--line);
            border-radius: 5px; padding: 5px 7px; font-size: 12.5px; min-width: 120px; }
        .lgf select[multiple] { min-height: 62px; }
        .lgf input:focus, .lgf select:focus { outline: none; border-color: var(--accent); }
        .lgsrc { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
        .lgsrc button { background: var(--bg); color: var(--ink-dim); border: 0; padding: 6px 14px;
            font-size: 12.5px; cursor: pointer; }
        .lgsrc button.on { background: var(--accent); color: #14181f; font-weight: 600; }
        .lgwrap { border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: calc(100vh - 300px); }
        table.lg { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
        table.lg thead th { position: sticky; top: 0; z-index: 2; background: var(--bg-raise); text-align: left;
            padding: 6px 9px; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
            color: var(--label); white-space: nowrap; border-bottom: 1px solid var(--line); }
        table.lg td { padding: 5px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
        table.lg tr:hover td { background: rgba(245,166,35,.06); }
        .lgmono { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
        .lgsev { display: inline-block; border-radius: 9px; padding: 1px 8px; font-size: 10.5px; font-weight: 600; }
        .sev-OK { background: rgba(60,180,120,.16); color: var(--ok); }
        .sev-FAIL { background: rgba(220,80,80,.16); color: var(--fail); }
        .sev-WAIT { background: rgba(245,166,35,.16); color: var(--accent); }
        .sev-RUN { background: rgba(90,150,230,.16); color: var(--run); }
        .sev-SKIP, .sev-INFO { background: rgba(140,150,170,.14); color: var(--ink-faint); }
        .lgod { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
        .lgod b { color: var(--ink); font-weight: 600; }
        .lgdet { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); max-width: 460px;
            word-break: break-word; }
        .lgpage { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--ink-dim); }
        .lgprod { color: var(--fail); font-weight: 600; font-size: 10px; }
        .lgcards { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .lgcard { border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; min-width: 104px; background: var(--bg-raise); }
        .lgcard.click { cursor: pointer; }
        .lgcard.click:hover { border-color: var(--accent); }
        .lgcard .k { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--label); }
        .lgcard .v { font-size: 19px; font-weight: 700; color: var(--ink); font-family: var(--mono); }
        .lgcard .v.fail { color: var(--fail); } .lgcard .v.ok { color: var(--ok); }
        .lgcard .sub { font-size: 10.5px; color: var(--ink-faint); }
        .lgtop { border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; min-width: 190px; background: var(--bg-raise); }
        .lgtop .k { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--label); margin-bottom: 3px; }
        .lgtop a { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11.5px;
            color: var(--ink-dim); cursor: pointer; padding: 1px 0; }
        .lgtop a:hover { color: var(--accent); }
        .lgchart { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
        .lgchart .hd { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; }
        .lgchart svg { display: block; width: 100%; height: 132px; cursor: crosshair; }
        .lgbar-ok { fill: var(--ok); } .lgbar-fail { fill: var(--fail); } .lgbar-wait { fill: var(--accent); }
        .lgbar-run { fill: var(--run); } .lgbar-info { fill: #7c8798; }
        .lgbar:hover { opacity: .75; }
        .lgbrush { fill: rgba(245,166,35,.18); stroke: var(--accent); stroke-width: 1; }
        .lglegend span { margin-right: 9px; font-size: 10.5px; }
        .lglegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    </style>
</head>
<body>
<div class="topbar">
    <a class="brand" th:href="@{/}"><img th:src="@{/img/logo.svg}" alt="">OPENPROTEO</a>
    <span class="sub">Log report</span>
    <span class="spacer"></span>
    <a class="btn sm ops" th:href="@{/overview}">▦ Operations</a>
    <a class="btn sm ops" th:href="@{/logs}">🗒 Log report</a>
    <a class="btn sm" th:href="@{/}">← Dashboard</a>
    <span class="clock" id="clock"></span>
</div>

<div class="wrap" style="max-width:1600px">
    <h1>Log report</h1>
    <p class="page-sub">Every audit event and every run of every feed in one place. Switch the source to
        search the runs and the output data they produced.</p>

    <div class="lgbar">
        <div class="lgf">
            <label>Source</label>
            <span class="lgsrc">
                <button type="button" id="srcEvents" class="on">Events</button>
                <button type="button" id="srcRuns">Runs &amp; output data</button>
            </span>
        </div>
        <div class="lgf"><label>Search</label><input type="text" id="fq" placeholder="free text…" style="min-width:210px"></div>
        <div class="lgf"><label>From</label><input type="text" id="ffrom" placeholder="2026-08-01 00:00:00"></div>
        <div class="lgf"><label>To</label><input type="text" id="fto" placeholder="2026-08-03 23:59:59"></div>
        <div class="lgf"><label>Source id</label><select id="fsource" multiple size="3"></select></div>
        <div class="lgf"><label>Target id</label><select id="ftarget" multiple size="3"></select></div>
        <div class="lgf"><label>Feed</label><select id="ffeed" multiple size="3"></select></div>
        <div class="lgf" id="wrapEvent"><label>Event</label><select id="fevent" multiple size="3"></select></div>
        <div class="lgf" id="wrapSev"><label>Severity</label><select id="fsev" multiple size="3"></select></div>
        <div class="lgf" id="wrapStatus" style="display:none"><label>Run status</label><select id="fstatus" multiple size="3"></select></div>
        <div class="lgf"><label>User</label><input type="text" id="fuser" placeholder="exact"></div>
        <div class="lgf"><label>&nbsp;</label><button class="btn sm" id="btnSearch">🔎 Search</button></div>
        <div class="lgf"><label>&nbsp;</label><button class="btn sm" id="btnReset">↺ Reset</button></div>
        <div class="lgf"><label>&nbsp;</label><button class="btn sm" id="btnCsv">⭳ CSV</button></div>
        <div class="lgf"><label>&nbsp;</label><button class="btn sm" id="btnReindex" title="rebuild the in-memory index from the files">⟳ Reindex</button></div>
    </div>

    <div class="lgcards" id="cards"></div>

    <div class="lgchart">
        <div class="hd">
            <b>Activity</b>
            <span id="chBucket" class="dim"></span>
            <span class="lglegend" id="chLegend"></span>
            <span class="spacer"></span>
            <span class="dim">drag to select a range · click a bar to zoom into it</span>
            <button class="btn sm" id="chReset">↺ Full range</button>
        </div>
        <svg id="chart" viewBox="0 0 1000 132" preserveAspectRatio="none"></svg>
    </div>

    <div class="lgwrap"><table class="lg" id="grid"><thead></thead><tbody></tbody></table></div>
    <div class="lgpage">
        <button class="btn sm" id="prev">◀ Prev</button>
        <button class="btn sm" id="next">Next ▶</button>
        <span id="pinfo"></span>
        <span class="spacer"></span>
        <span id="idxinfo" class="dim"></span>
    </div>
</div>

<script th:src="@{/js/modal.js(v=${buildId})}"></script>
<script th:src="@{/js/theme.js(v=${buildId})}"></script>
<script>
    var CTX = location.pathname.replace(/logs\/?$/, '');
    var SRC = 'events', PAGE = 0, SIZE = 100, TOTAL = 0, STEP = '';

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function json(r) { return r.json().catch(function () { return null; }); }
    function picked(id) {
        var el = $(id), out = [];
        if (!el) return out;
        for (var i = 0; i < el.options.length; i++) if (el.options[i].selected) out.push(el.options[i].value);
        return out;
    }
    function fill(id, values, labels) {
        var el = $(id);
        if (!el) return;
        el.innerHTML = '';
        for (var i = 0; i < values.length; i++) {
            var o = document.createElement('option');
            o.value = values[i];
            o.textContent = labels ? labels[i] : values[i];
            el.appendChild(o);
        }
    }

    function loadFacets() {
        fetch(CTX + 'api/logs/facets').then(json).then(function (j) {
            if (!j) return;
            fill('fsource', j.sources || []);
            fill('ftarget', j.targets || []);
            var feeds = j.feeds || [], ids = [], lbl = [];
            for (var i = 0; i < feeds.length; i++) {
                ids.push(feeds[i].feedId);
                lbl.push(feeds[i].feedId + (feeds[i].name ? ('  ' + feeds[i].name) : ''));
            }
            fill('ffeed', ids, lbl);
            fill('fevent', j.events || []);
            fill('fsev', j.severities || []);
            fill('fstatus', j.statuses || []);
        }).catch(function () { });
        fetch(CTX + 'api/logs/status').then(json).then(function (j) {
            if (!j) return;
            $('idxinfo').textContent = 'index: ' + (j.events || 0) + ' events · ' + (j.runs || 0) + ' runs · '
                + (j.outputs || 0) + ' outputs · window ' + (j.windowDays || 0) + 'd';
        }).catch(function () { });
    }

    function params() {
        var p = [];
        function add(k, v) { if (v !== null && v !== undefined && String(v) !== '') p.push(k + '=' + encodeURIComponent(v)); }
        function addAll(k, arr) { for (var i = 0; i < arr.length; i++) add(k, arr[i]); }
        add('q', $('fq').value.trim());
        add('from', $('ffrom').value.trim());
        add('to', $('fto').value.trim());
        add('user', $('fuser').value.trim());
        add('step', STEP);
        addAll('sourceId', picked('fsource'));
        addAll('targetId', picked('ftarget'));
        addAll('feedId', picked('ffeed'));
        if (SRC === 'events') {
            addAll('event', picked('fevent'));
            addAll('severity', picked('fsev'));
        } else {
            addAll('status', picked('fstatus'));
        }
        add('page', PAGE);
        add('size', SIZE);
        return p.join('&');
    }

    function feedCell(r) {
        var h = '<a href="' + CTX + 'workflow/' + encodeURIComponent(r.feedId) + '">' + esc(r.feedId) + '</a>';
        if (r.production) h += ' <span class="lgprod">PROD</span>';
        if (r.workflowName) h += '<div class="dim small">' + esc(r.workflowName) + '</div>';
        return h;
    }
    function runCell(r) {
        if (!r.runId) return '';
        return '<a class="lgmono" href="' + CTX + 'run/' + encodeURIComponent(r.feedId) + '/' + encodeURIComponent(r.runId) + '">'
            + esc(r.runId) + '</a>';
    }

    function render(j) {
        var head = $('grid').tHead, body = $('grid').tBodies[0];
        TOTAL = (j && j.total) || 0;
        var rows = (j && j.rows) || [];
        var cols = (SRC === 'events')
            ? ['When', 'Feed', 'Source', 'Target', 'Run', 'Step', 'Event', 'Severity', 'User', 'Details']
            : ['Started', 'Ended', 'Feed', 'Source', 'Target', 'Run', 'Status', 'Trigger', 'Steps', 'Output data'];
        var h = '<tr>';
        for (var i = 0; i < cols.length; i++) h += '<th>' + cols[i] + '</th>';
        head.innerHTML = h + '</tr>';

        var b = '';
        for (var k = 0; k < rows.length; k++) {
            var r = rows[k];
            b += '<tr>';
            if (SRC === 'events') {
                b += '<td class="lgmono">' + esc(r.ts) + '</td>';
                b += '<td>' + feedCell(r) + '</td>';
                b += '<td>' + esc(r.sourceId) + '</td><td>' + esc(r.targetId) + '</td>';
                b += '<td>' + runCell(r) + '</td>';
                b += '<td class="lgmono">' + esc(r.node) + '</td>';
                b += '<td class="lgmono">' + esc(r.event) + '</td>';
                b += '<td><span class="lgsev sev-' + esc(r.severity) + '">' + esc(r.severity) + '</span></td>';
                b += '<td>' + esc(r.user) + '</td>';
                b += '<td class="lgdet">' + esc(r.details) + '</td>';
            } else {
                b += '<td class="lgmono">' + esc(r.startTs) + '</td><td class="lgmono">' + esc(r.endTs) + '</td>';
                b += '<td>' + feedCell(r) + '</td>';
                b += '<td>' + esc(r.sourceId) + '</td><td>' + esc(r.targetId) + '</td>';
                b += '<td>' + runCell(r) + '</td>';
                var sev = (r.status && r.status.indexOf('FAIL') >= 0) ? 'FAIL'
                        : (r.status === 'SUCCESS' ? 'OK' : (r.status === 'RUNNING' ? 'RUN' : 'WAIT'));
                b += '<td><span class="lgsev sev-' + sev + '">' + esc(r.status) + '</span>'
                    + (r.message ? ('<div class="dim small">' + esc(r.message) + '</div>') : '') + '</td>';
                b += '<td>' + esc(r.trigger) + (r.triggeredBy ? ('<div class="dim small">' + esc(r.triggeredBy) + '</div>') : '') + '</td>';
                b += '<td class="lgmono">' + esc(r.stepsOk) + '/' + esc(r.stepsTotal)
                    + (r.stepsFailed ? (' <span style="color:var(--fail)">' + esc(r.stepsFailed) + ' failed</span>') : '') + '</td>';
                var od = r.outputData || [], ods = '';
                for (var z = 0; z < od.length; z++) {
                    ods += '<span class="lgod"><b>' + esc(od[z].label || od[z].name) + '</b> = ' + esc(od[z].value) + '</span>';
                }
                b += '<td>' + (ods || '<span class="dim">—</span>') + '</td>';
            }
            b += '</tr>';
        }
        body.innerHTML = b || ('<tr><td colspan="' + cols.length + '" class="dim" style="padding:18px">No rows for these filters.</td></tr>');

        var first = TOTAL === 0 ? 0 : (PAGE * SIZE + 1), last = Math.min(TOTAL, (PAGE + 1) * SIZE);
        $('pinfo').textContent = (TOTAL === 0 ? 'no results' : (first + '–' + last + ' of ' + TOTAL))
            + (j && j.coldScan ? '  · read from the files (outside the in-memory window)' : '')
            + (j && j.truncated ? '  · truncated' : '');
        if (j && j.error) $('pinfo').textContent = j.error;
        $('prev').disabled = PAGE <= 0;
        $('next').disabled = last >= TOTAL;
    }

    var SEV_CLASS = { OK:'lgbar-ok', FAIL:'lgbar-fail', WAIT:'lgbar-wait', RUN:'lgbar-run', SKIP:'lgbar-info', INFO:'lgbar-info' };
    var SEV_COLOR = { OK:'var(--ok)', FAIL:'var(--fail)', WAIT:'var(--accent)', RUN:'var(--run)', SKIP:'#7c8798', INFO:'#7c8798' };
    var SEV_ORDER = ['FAIL', 'WAIT', 'RUN', 'OK', 'SKIP', 'INFO'];
    var NS = 'http://www.w3.org/2000/svg';

    function fmtTs(ms) {
        var d = new Date(ms);
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
            + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    function svgEl(name, attrs) {
        var e = document.createElementNS(NS, name);
        for (var a in attrs) if (attrs.hasOwnProperty(a)) e.setAttribute(a, attrs[a]);
        return e;
    }

    function drawChart(j) {
        var svg = $('chart');
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var series = (j && j.series) || [];
        $('chBucket').textContent = series.length ? ('bucket ' + j.bucketLabel + (j.truncated ? ' · truncated' : '')) : '';
        var lg = '';
        for (var q1 = 0; q1 < SEV_ORDER.length; q1++) {
            lg += '<span><i style="background:' + SEV_COLOR[SEV_ORDER[q1]] + '"></i>' + SEV_ORDER[q1] + '</span>';
        }
        $('chLegend').innerHTML = series.length ? lg : '';
        if (!series.length) return;

        var byBucket = {}, order = [], max = 0;
        for (var k = 0; k < series.length; k++) {
            var pt = series[k], b = byBucket[pt.bucketMs];
            if (!b) { b = byBucket[pt.bucketMs] = { ms: pt.bucketMs, total: 0, sev: {} }; order.push(b); }
            b.sev[pt.severity] = (b.sev[pt.severity] || 0) + pt.count;
            b.total += pt.count;
            if (b.total > max) max = b.total;
        }
        order.sort(function (x, y) { return x.ms - y.ms; });

        var W = 1000, H = 132, plotH = H - 30;
        var n = order.length, bw = Math.max(1, (W / n) - 1);
        var t0 = order[0].ms, t1 = order[n - 1].ms + (j.bucketWidthMs || 1);

        for (var i2 = 0; i2 < n; i2++) {
            var b2 = order[i2], x = (i2 * W) / n, y = H - 16;
            for (var s2 = 0; s2 < SEV_ORDER.length; s2++) {
                var sv = SEV_ORDER[s2], cnt = b2.sev[sv] || 0;
                if (!cnt) continue;
                var h = Math.max(1, (cnt / max) * plotH);
                y -= h;
                var rect = svgEl('rect', { x: x.toFixed(2), y: y.toFixed(2), width: bw.toFixed(2), height: h.toFixed(2) });
                rect.setAttribute('class', 'lgbar ' + SEV_CLASS[sv]);
                var tt = document.createElementNS(NS, 'title');
                tt.textContent = fmtTs(b2.ms) + '  ' + sv + ': ' + cnt + '  (total ' + b2.total + ')';
                rect.appendChild(tt);
                rect.addEventListener('click', (function (bk) {
                    return function () { zoomTo(bk.ms, bk.ms + (j.bucketWidthMs || 1)); };
                })(b2));
                svg.appendChild(rect);
            }
        }
        svg.appendChild(svgEl('line', { x1: 0, y1: H - 16, x2: W, y2: H - 16, stroke: 'var(--line)', 'stroke-width': 1 }));
        var l0 = svgEl('text', { x: 2, y: H - 4, fill: 'var(--ink-faint)', 'font-size': 10 });
        l0.textContent = fmtTs(t0); svg.appendChild(l0);
        var l1 = svgEl('text', { x: W - 2, y: H - 4, fill: 'var(--ink-faint)', 'font-size': 10, 'text-anchor': 'end' });
        l1.textContent = fmtTs(t1); svg.appendChild(l1);

        var brush = null, startX = 0;
        svg.onmousedown = function (ev) {
            var r = svg.getBoundingClientRect();
            startX = ((ev.clientX - r.left) / r.width) * W;
            brush = svgEl('rect', { x: startX, y: 0, width: 0, height: H - 16 });
            brush.setAttribute('class', 'lgbrush');
            svg.appendChild(brush);
        };
        svg.onmousemove = function (ev) {
            if (!brush) return;
            var r = svg.getBoundingClientRect(), cur = ((ev.clientX - r.left) / r.width) * W;
            brush.setAttribute('x', Math.min(startX, cur));
            brush.setAttribute('width', Math.abs(cur - startX));
        };
        svg.onmouseup = function (ev) {
            if (!brush) return;
            var r = svg.getBoundingClientRect(), cur = ((ev.clientX - r.left) / r.width) * W;
            var a = Math.min(startX, cur), b3 = Math.max(startX, cur);
            svg.removeChild(brush); brush = null;
            if (b3 - a < 4) return;                       // a click, not a drag: the bar handler takes it
            zoomTo(t0 + ((t1 - t0) * a) / W, t0 + ((t1 - t0) * b3) / W);
        };
        svg.onmouseleave = function () { if (brush) { svg.removeChild(brush); brush = null; } };
    }

    function zoomTo(fromMs, toMs) {
        $('ffrom').value = fmtTs(Math.floor(fromMs));
        $('fto').value = fmtTs(Math.ceil(toMs));
        PAGE = 0;
        search();
    }

    function card(k, v, sub, cls, onClick) {
        var d = document.createElement('div');
        d.className = 'lgcard' + (onClick ? ' click' : '');
        d.innerHTML = '<div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + esc(v) + '</div>'
            + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
        if (onClick) { d.title = 'click to filter'; d.onclick = onClick; }
        return d;
    }
    function topCard(k, items, onPick) {
        var d = document.createElement('div');
        d.className = 'lgtop';
        var h = '<div class="k">' + esc(k) + '</div>';
        if (!items || !items.length) h += '<div class="sub">none</div>';
        d.innerHTML = h;
        for (var i = 0; i < (items || []).length; i++) {
            (function (it) {
                var a = document.createElement('a');
                a.innerHTML = '<span>' + esc(it.key) + '</span><b>' + esc(it.count) + '</b>';
                a.onclick = function () { onPick(it.key); };
                d.appendChild(a);
            })(items[i]);
        }
        return d;
    }
    function selectOnly(id, value) {
        var el = $(id);
        for (var i = 0; el && i < el.options.length; i++) el.options[i].selected = (el.options[i].value === value);
    }

    function drawCards(m) {
        var box = $('cards');
        box.innerHTML = '';
        if (!m) return;
        if (SRC === 'events') {
            box.appendChild(card('Events', m.events || 0, null, null, null));
            box.appendChild(card('Runs touched', m.runs || 0, null, null, null));
            box.appendChild(card('Feeds touched', m.feeds || 0, null, null, null));
            box.appendChild(card('Failures', m.failures || 0, 'severity FAIL', 'fail', function () {
                selectOnly('fsev', 'FAIL'); PAGE = 0; search();
            }));
            box.appendChild(card('Successes', m.successes || 0, 'severity OK', 'ok', function () {
                selectOnly('fsev', 'OK'); PAGE = 0; search();
            }));
            box.appendChild(card('Avg step', m.avgStepSeconds == null ? '—' : (m.avgStepSeconds + 's'),
                    'started → completed', null, null));
            box.appendChild(topCard('Top feeds by failure', m.topFeedsByFailure, function (k) {
                selectOnly('ffeed', k); PAGE = 0; search();
            }));
            box.appendChild(topCard('Top steps by failure', m.topStepsByFailure, function (k) {
                $('fq').value = ''; selectOnly('fsev', 'FAIL');
                STEP = k; PAGE = 0; search();
            }));
        } else {
            box.appendChild(card('Runs', m.runs || 0, null, null, null));
            box.appendChild(card('Feeds touched', m.feeds || 0, null, null, null));
            box.appendChild(card('Succeeded', m.succeeded || 0, null, 'ok', null));
            box.appendChild(card('Failed', m.failed || 0, (m.failedSteps || 0) + ' failed step(s)', 'fail', null));
            box.appendChild(card('Avg run', m.avgRunSeconds == null ? '—' : (m.avgRunSeconds + 's'),
                    'start → end', null, null));
            box.appendChild(topCard('Top feeds by failure', m.topFeedsByFailure, function (k) {
                selectOnly('ffeed', k); PAGE = 0; search();
            }));
        }
    }

    function loadMetrics() {
        fetch(CTX + 'api/logs/metrics?source=' + SRC + '&' + params())
            .then(json).then(function (m) { if (m && !m.error) drawCards(m); }).catch(function () { });
    }

    function loadChart() {
        fetch(CTX + 'api/logs/timeseries?source=' + SRC + '&' + params())
            .then(json).then(function (j) { if (j && !j.error) drawChart(j); }).catch(function () { });
    }

    function search() {
        var url = CTX + 'api/logs/' + (SRC === 'events' ? 'search' : 'runs') + '?' + params();
        $('pinfo').textContent = 'searching…';
        fetch(url).then(json).then(function (j) {
            if (j && j.error) { $('pinfo').textContent = 'error: ' + j.error; return; }
            render(j);
            loadChart();
            loadMetrics();
        }).catch(function (e) { $('pinfo').textContent = 'error: ' + e; });
    }

    function setSource(s) {
        SRC = s; PAGE = 0;
        $('srcEvents').className = (s === 'events') ? 'on' : '';
        $('srcRuns').className = (s === 'runs') ? 'on' : '';
        $('wrapEvent').style.display = (s === 'events') ? '' : 'none';
        $('wrapSev').style.display = (s === 'events') ? '' : 'none';
        $('wrapStatus').style.display = (s === 'runs') ? '' : 'none';
        search();
    }

    $('srcEvents').onclick = function () { setSource('events'); };
    $('srcRuns').onclick = function () { setSource('runs'); };
    $('btnSearch').onclick = function () { PAGE = 0; search(); };
    $('btnReset').onclick = function () {
        ['fq', 'ffrom', 'fto', 'fuser'].forEach(function (id) { $(id).value = ''; });
        STEP = '';
        ['fsource', 'ftarget', 'ffeed', 'fevent', 'fsev', 'fstatus'].forEach(function (id) {
            var el = $(id);
            for (var i = 0; el && i < el.options.length; i++) el.options[i].selected = false;
        });
        PAGE = 0; search();
    };
    $('chReset').onclick = function () { $('ffrom').value = ''; $('fto').value = ''; PAGE = 0; search(); };
    $('btnCsv').onclick = function () {
        window.location = CTX + 'api/logs/export?source=' + SRC + '&' + params();
    };
    $('btnReindex').onclick = function () {
        opConfirm('Rebuild the log index from the files? Queries stay available meanwhile.', function () {
            $('idxinfo').textContent = 'reindexing…';
            fetch(CTX + 'api/logs/reindex', { method: 'POST' }).then(json).then(function (j) {
                if (j && j.ok) {
                    $('idxinfo').textContent = 'index: ' + (j.events || 0) + ' events · ' + (j.runs || 0)
                        + ' runs · ' + (j.outputs || 0) + ' outputs · rebuilt in ' + (j.elapsedMs || 0) + ' ms';
                    search();
                } else {
                    $('idxinfo').textContent = 'reindex failed: ' + ((j && j.error) || 'unknown');
                }
            }).catch(function (e) { $('idxinfo').textContent = 'reindex failed: ' + e; });
        });
    };
    $('prev').onclick = function () { if (PAGE > 0) { PAGE--; search(); } };
    $('next').onclick = function () { PAGE++; search(); };
    $('fq').onkeydown = function (e) { if (e.key === 'Enter') { PAGE = 0; search(); } };

    loadFacets();
    search();
</script>
</body>
</html>
