<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenProteo &mdash; standalone JSON viewer</title>
<style>
  :root{--bg:#0d1117;--raise:#151b24;--panel:#1a2230;--line:#2b3648;--soft:#222c3c;
        --ink:#d8e1ec;--dim:#8593a8;--faint:#5a677c;--accent:#f5a623;--val:#58a6ff;--hitbg:#2e2410;
        --mono:Consolas,"Cascadia Mono","Courier New",monospace;
        --sans:"Segoe UI","Segoe UI Variable",Tahoma,sans-serif}
  :root[data-theme="light"]{--bg:#eef1f5;--raise:#ffffff;--panel:#f4f7fb;--line:#c9d2dd;--soft:#dde3ea;
        --ink:#1b2530;--dim:#51606f;--faint:#7b8794;--accent:#9a6100;--val:#0a5bd3;--hitbg:#fdf1cf}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .wrap{max-width:1400px;margin:0 auto;padding:16px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);margin:0 0 14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  button,.browse{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover,.browse:hover{border-color:var(--accent)}
  .browse input{display:none}
  input[type=text]{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:5px 8px;font-size:12px;min-width:280px;font-family:inherit}
  .dim{color:var(--dim)}
  .small{font-size:11.5px}
  .banner{border-radius:6px;padding:9px 12px;margin:10px 0;border:1px solid var(--line);background:var(--raise)}
  .banner.error{background:#2d1416;color:#f85149;border-color:#5c2a2a}
  :root[data-theme="light"] .banner.error{background:#ffe9e9;color:#cf222e;border-color:#e5a3a3}
  .drop{border:2px dashed var(--line);border-radius:8px;padding:34px;text-align:center;color:var(--dim);margin-top:16px}
  .drop.drag{border-color:var(--accent);color:var(--ink)}
  .xt-wrap{max-height:72vh}

.xt-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: auto; background: var(--bg); padding: 6px; }
.xt-block { margin: 0 0 8px 0; }
.xt-kids { margin: 6px 0 0 18px; border-left: 2px solid var(--soft); padding-left: 10px; }
.xt-head { display: flex; align-items: center; gap: 7px; padding: 6px 9px;
           background: #31435f; border: 1px solid var(--line); border-left: 4px solid var(--accent);
           border-radius: 5px 5px 0 0; font-family: var(--mono); font-size: 12.5px;
           letter-spacing: .2px; }
.xt-head:hover { background: #3b4f70; }
.xt-tog { display: inline-block; width: 10px; color: var(--faint); flex: 0 0 auto; }
.xt-tog-btn { cursor: pointer; }
.xt-tag { color: var(--accent); font-weight: 600; }
.xt-comment { color: var(--faint); font-style: italic; }
.xt-count { margin-left: auto; color: var(--faint); background: var(--soft);
            border-radius: 8px; padding: 0 7px; font-size: 10.5px; }
.xt-tbl { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px;
          border: 1px solid var(--line); border-top: 0; background: var(--bg); }
.xt-tbl th { text-align: left; padding: 6px 8px; background: #3b5178; color: #eef3fb;
             font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .4px;
             border-right: 1px solid var(--line); border-bottom: 2px solid var(--accent);
             white-space: nowrap; position: sticky; top: 0; }
.xt-tbl td { padding: 3px 8px; border-right: 1px solid var(--soft);
             border-bottom: 1px solid var(--soft); vertical-align: top; word-break: break-word; }
.xt-tbl tbody tr:nth-child(even) > td { background: var(--raise); }
.xt-tbl tbody tr:hover > td { background: var(--panel); }
.xt-kv td.xt-k { color: #a9b8cc; white-space: nowrap; width: 1%;
                 background: #1b2534; font-weight: 600; }
.xt-tbl td.xt-v { color: var(--val); }
.xt-tbl td.xt-null { background: repeating-linear-gradient(45deg, transparent, transparent 4px, var(--soft) 4px, var(--soft) 5px); }
.xt-tbl td.xt-num, .xt-tbl th.xt-num { color: var(--faint); width: 1%; text-align: right; white-space: nowrap; }
.xt-tbl tr.xt-sub > td { background: var(--bg); padding: 8px 8px 8px 18px; }
.xt-text { padding: 5px 8px; border: 1px solid var(--line); border-top: 0; background: var(--bg);
           color: var(--ink); font-family: var(--mono); font-size: 12px;
           white-space: pre-wrap; word-break: break-word; }
.xt-wrap mark { background: var(--accent); color: #1b2530; border-radius: 2px; padding: 0 1px; }
.xt-empty { padding: 14px; color: var(--dim); }
:root[data-theme="light"] .xt-head { background: #bcd3ec; }
:root[data-theme="light"] .xt-head:hover { background: #aac7e6; }
:root[data-theme="light"] .xt-tbl th { background: #a5c4e6; color: #16283c; }
:root[data-theme="light"] .xt-tbl tbody tr:nth-child(even) > td { background: #f7f9fc; }
:root[data-theme="light"] .xt-tbl tbody tr:hover > td { background: #eef3fa; }
:root[data-theme="light"] .xt-kv td.xt-k { background: #e7eef7; color: #3d4d61; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" style="justify-content:space-between">
    <div>
      <h1>OpenProteo &mdash; standalone JSON viewer</h1>
      <p class="sub small">Everything runs in this page: no upload, no network, no external library. The file never leaves your machine.</p>
    </div>
    <button id="themeBtn">&#9788; light</button>
  </div>

  <div class="bar">
    <label class="browse">Browse&hellip;<input type="file" id="jsonFile" accept=".json,.jsonl,.txt"></label>
    <span id="fileName" class="dim small">no file</span>
  </div>

  <div id="msg" class="banner">Choose a JSON file, or drag one anywhere on this page.</div>

  <div id="tabs" class="tabs" style="display:none">
    <button class="tab active" id="tabTree">Table</button>
    <button class="tab" id="tabCode">Code</button>
  </div>

  <div id="treePane" style="display:none">
    <div class="bar">
      <input type="text" id="q" placeholder="search keys and values&hellip;">
      <span id="qinfo" class="dim small"></span>
      <button id="expandAll">Expand all</button>
      <button id="collapseAll">Collapse all</button>
    </div>
    <div id="tree" class="xt-wrap"></div>
  </div>

  <div id="codePane" style="display:none"><pre class="code" id="code"></pre></div>

  <div id="drop" class="drop">&hellip;or drag &amp; drop a JSON file here</div>
</div>

<script>
(function () {
  var NL = String.fromCharCode(10);
  function $(id) { return document.getElementById(id); }

  // theme
  try { var t = localStorage.getItem('opj-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  function refreshTheme() {
    var lt = document.documentElement.getAttribute('data-theme') === 'light';
    $('themeBtn').innerHTML = lt ? (String.fromCharCode(0x263E) + ' dark') : (String.fromCharCode(0x2600) + ' light');
  }
  $('themeBtn').onclick = function () {
    var lt = document.documentElement.getAttribute('data-theme') === 'light';
    if (lt) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('opj-theme', lt ? 'dark' : 'light'); } catch (e) {}
    refreshTheme();
  };
  refreshTheme();

    /* ===================== JSON table view (shared) =====================
       Renders JSON as TABLES, on the same principles as the XML view:
         - an object becomes a titled block with a Key | Value table;
         - an ARRAY OF OBJECTS becomes ONE table whose header is the union of the keys found across
           its elements, one numbered row per element - which is what a list of entities is, and the
           whole point of this view;
         - an array of scalars becomes a numbered two-column table;
         - a value that is itself an object or an array shows a short summary and a toggle that opens
           it in a full-width sub-row, so depth is reachable without the page becoming a wall.
       A light model is built once (references plus a lowercase haystack) and the tables are rendered
       from it on demand, so a large document does not build every cell before the first paint, and
       search still finds matches inside branches that have never been drawn.
       Newlines are built with String.fromCharCode: literal escapes are rewritten by the proxy. */
    function jsonEsc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function jsonMark(s, q) {
        s = String(s == null ? '' : s);
        if (!q) return jsonEsc(s);
        var lo = s.toLowerCase(), ql = q.toLowerCase(), out = '', from = 0, p;
        while ((p = lo.indexOf(ql, from)) >= 0) {
            out += jsonEsc(s.substring(from, p)) + '<mark>' + jsonEsc(s.substr(p, ql.length)) + '</mark>';
            from = p + ql.length;
        }
        return out + jsonEsc(s.substring(from));
    }
    function jsonKind(v) {
        if (v === null) return 'null';
        if (Array.isArray(v)) return 'array';
        return typeof v;                      // object | string | number | boolean | undefined
    }
    function jsonIsLeaf(v) { var k = jsonKind(v); return k !== 'object' && k !== 'array'; }
    /** Short stand-in shown in a cell for a nested value, so a row stays one line. */
    function jsonSummary(v) {
        var k = jsonKind(v);
        if (k === 'array') return '[ ' + v.length + (v.length === 1 ? ' item' : ' items') + ' ]';
        if (k === 'object') { var n = Object.keys(v).length; return '{ ' + n + (n === 1 ? ' key' : ' keys') + ' }'; }
        return String(v);
    }
    /** Scalar rendered for a cell, with its type carried in a class so numbers read as numbers. */
    function jsonScalarCell(v, q) {
        var k = jsonKind(v);
        if (k === 'null') return '<span class="xt-nullv">null</span>';
        if (k === 'boolean' || k === 'number') return '<span class="xt-numv">' + jsonMark(String(v), q) + '</span>';
        return '<span class="xt-str">' + jsonMark(String(v), q) + '</span>';
    }

    /** Model: one record per container AND per leaf, so search can reach a value never drawn. */
    function jsonBuildModel(root) {
        var all = [];
        function walk(key, val, parent, depth) {
            var m = { key: key, val: val, kind: jsonKind(val), parent: parent, depth: depth,
                      idx: all.length, children: [] };
            all.push(m);
            if (m.kind === 'object') {
                var ks = Object.keys(val);
                for (var i = 0; i < ks.length; i++) m.children.push(walk(ks[i], val[ks[i]], m, depth + 1));
            } else if (m.kind === 'array') {
                for (var j = 0; j < val.length; j++) m.children.push(walk(String(j), val[j], m, depth + 1));
            }
            m.hay = (String(key == null ? '' : key) + ' ' + (jsonIsLeaf(val) ? String(val) : '')).toLowerCase();
            return m;
        }
        return { root: walk(null, root, null, 0), all: all };
    }
    /** Union of the keys of an array's object elements, in first-seen order. */
    function jsonRowKeys(items) {
        var cols = [], seen = {};
        for (var i = 0; i < items.length; i++) {
            var v = items[i].val;
            if (jsonKind(v) !== 'object') continue;
            var ks = Object.keys(v);
            for (var k = 0; k < ks.length; k++) if (!seen[ks[k]]) { seen[ks[k]] = 1; cols.push(ks[k]); }
        }
        return cols;
    }

    /** Builds into host. Returns { count, expandAll, collapseAll, search }. */
    function buildJsonTable(host, data) {
        host.innerHTML = '';
        var model = jsonBuildModel(data);
        var query = '', keep = null, openSet = {};
        openSet[model.root.idx] = true;
        function visible(m) { return !keep || keep[m.idx]; }
        function el2(tag, cls, parent) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (parent) parent.appendChild(e);
            return e;
        }
        function head(into, label, count, m) {
            var h = el2('div', 'xt-head', into);
            var tog = el2('span', 'xt-tog', h);
            if (m && m.children.length) {
                tog.textContent = openSet[m.idx] ? String.fromCharCode(0x25BE) : String.fromCharCode(0x25B8);
                h.style.cursor = 'pointer';
                h.addEventListener('click', function () { openSet[m.idx] = !openSet[m.idx]; draw(); });
            }
            var t = el2('span', 'xt-tag', h);
            t.innerHTML = jsonMark(label, query);
            if (count) { var c = el2('span', 'xt-count', h); c.textContent = count; }
            return h;
        }

        function renderNode(m, into, label) {
            if (m.kind === 'object') return renderObject(m, into, label);
            if (m.kind === 'array') return renderArray(m, into, label);
            var blk = el2('div', 'xt-block', into);
            head(blk, label, null, null);
            var tx = el2('div', 'xt-text', blk);
            tx.innerHTML = jsonScalarCell(m.val, query);
            return blk;
        }

        function renderObject(m, into, label) {
            var blk = el2('div', 'xt-block', into);
            var kids = m.children.filter(visible);
            head(blk, label, kids.length + (kids.length === 1 ? ' key' : ' keys'), m);
            if (!openSet[m.idx]) return blk;
            if (!kids.length) { el2('div', 'xt-text', blk).textContent = '(no keys)'; return blk; }
            var t = el2('table', 'xt-tbl xt-kv', blk);
            var tb = el2('tbody', null, t);
            for (var i = 0; i < kids.length; i++) {
                (function (c) {
                    var tr = el2('tr', null, tb);
                    var k = el2('td', 'xt-k', tr);
                    k.innerHTML = jsonMark(String(c.key), query);
                    var v = el2('td', 'xt-v', tr);
                    if (jsonIsLeaf(c.val)) { v.innerHTML = jsonScalarCell(c.val, query); return; }
                    var b = el2('span', 'xt-tog xt-tog-btn', v);
                    b.textContent = openSet[c.idx] ? String.fromCharCode(0x25BE) : String.fromCharCode(0x25B8);
                    var lab = el2('span', 'xt-sum', v);
                    lab.textContent = ' ' + jsonSummary(c.val);
                    v.style.cursor = 'pointer';
                    v.addEventListener('click', function () { openSet[c.idx] = !openSet[c.idx]; draw(); });
                    if (openSet[c.idx]) {
                        var sub = el2('tr', 'xt-sub', tb);
                        var cell = el2('td', null, sub);
                        cell.colSpan = 2;
                        renderNode(c, cell, String(c.key));
                    }
                })(kids[i]);
            }
            return blk;
        }

        function renderArray(m, into, label) {
            var blk = el2('div', 'xt-block', into);
            var items = m.children.filter(visible);
            head(blk, label, items.length + (items.length === 1 ? ' item' : ' items'), m);
            if (!openSet[m.idx]) return blk;
            if (!items.length) { el2('div', 'xt-text', blk).textContent = '(empty)'; return blk; }

            var cols = jsonRowKeys(items);
            var table = el2('table', 'xt-tbl xt-list', blk);
            var thead = el2('thead', null, table);
            var hr = el2('tr', null, thead);
            var anyNested = false;
            for (var z = 0; z < items.length; z++) if (!jsonIsLeaf(items[z].val)) anyNested = true;
            if (anyNested) el2('th', 'xt-num', hr).textContent = '';
            el2('th', 'xt-num', hr).textContent = '#';
            if (cols.length) {
                for (var c0 = 0; c0 < cols.length; c0++) el2('th', null, hr).innerHTML = jsonMark(cols[c0], query);
            } else {
                el2('th', null, hr).textContent = 'value';
            }
            var tb = el2('tbody', null, table);
            for (var i = 0; i < items.length; i++) {
                (function (it, rowNo) {
                    var tr = el2('tr', null, tb);
                    if (anyNested) {
                        var td0 = el2('td', 'xt-num', tr);
                        if (!jsonIsLeaf(it.val)) {
                            var b = el2('span', 'xt-tog xt-tog-btn', td0);
                            b.textContent = openSet[it.idx] ? String.fromCharCode(0x25BE) : String.fromCharCode(0x25B8);
                            td0.style.cursor = 'pointer';
                            td0.addEventListener('click', function () { openSet[it.idx] = !openSet[it.idx]; draw(); });
                        }
                    }
                    el2('td', 'xt-num', tr).textContent = String(rowNo);
                    if (cols.length) {
                        var obj = (jsonKind(it.val) === 'object') ? it.val : null;
                        for (var c1 = 0; c1 < cols.length; c1++) {
                            var has = obj && Object.prototype.hasOwnProperty.call(obj, cols[c1]);
                            var td = el2('td', has ? 'xt-v' : 'xt-v xt-null', tr);
                            if (!has) { td.textContent = ''; continue; }
                            var cv = obj[cols[c1]];
                            if (jsonIsLeaf(cv)) td.innerHTML = jsonScalarCell(cv, query);
                            else { td.className = 'xt-v xt-sum'; td.textContent = jsonSummary(cv); }
                        }
                    } else {
                        var tdv = el2('td', 'xt-v', tr);
                        if (jsonIsLeaf(it.val)) tdv.innerHTML = jsonScalarCell(it.val, query);
                        else tdv.textContent = jsonSummary(it.val);
                    }
                    if (!jsonIsLeaf(it.val) && openSet[it.idx]) {
                        var sub = el2('tr', 'xt-sub', tb);
                        var cell = el2('td', null, sub);
                        cell.colSpan = (anyNested ? 1 : 0) + 1 + (cols.length ? cols.length : 1);
                        renderNode(it, cell, '[' + rowNo + ']');
                    }
                })(items[i], i + 1);
            }
            return blk;
        }

        function draw() {
            host.innerHTML = '';
            if (keep && !keep[model.root.idx]) { host.innerHTML = '<div class="xt-empty">no match</div>'; return; }
            renderNode(model.root, host, model.root.kind === 'array' ? 'root (array)' : 'root');
        }

        function search(q) {
            query = (q || '').trim();
            if (!query) { keep = null; draw(); return 0; }
            var ql = query.toLowerCase(), hits = 0;
            keep = [];
            for (var i = 0; i < model.all.length; i++) {
                var hit = model.all[i].hay.indexOf(ql) >= 0;
                keep[i] = hit;
                if (hit) hits++;
            }
            for (var k = model.all.length - 1; k >= 0; k--) {
                if (!keep[k]) continue;
                openSet[model.all[k].idx] = true;
                var p = model.all[k].parent;
                while (p) { keep[p.idx] = true; openSet[p.idx] = true; p = p.parent; }
            }
            draw();
            return hits;
        }

        draw();
        return {
            count: model.all.length,
            expandAll: function () { for (var i = 0; i < model.all.length; i++) openSet[model.all[i].idx] = true; draw(); },
            collapseAll: function () { openSet = {}; openSet[model.root.idx] = true; draw(); },
            search: search
        };
    }

  // ---- Code tab: the document re-printed, so it can be read as text when needed ----
  function formatJson(s) {
    try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return null; }
  }

  var api = null;
  function show(kind) {
    var tree = (kind === 'tree');
    $('tabTree').classList.toggle('active', tree);
    $('tabCode').classList.toggle('active', !tree);
    $('treePane').style.display = tree ? '' : 'none';
    $('codePane').style.display = tree ? 'none' : '';
  }
  $('tabTree').onclick = function () { show('tree'); };
  $('tabCode').onclick = function () { show('code'); };
  $('expandAll').onclick = function () { if (api) api.expandAll(); };
  $('collapseAll').onclick = function () { if (api) api.collapseAll(); };
  $('q').addEventListener('input', function () {
    if (!api) return;
    var v = $('q').value, n = api.search(v);
    $('qinfo').textContent = v.trim() ? (n + ' match' + (n === 1 ? '' : 'es')) : (api.count + ' nodes');
  });

  function load(fileText, fileNameStr) {
    $('fileName').textContent = fileNameStr;
    var data = null, bad = null;
    try { data = JSON.parse(fileText); } catch (e) { bad = String(e.message || e); }
    $('code').textContent = (bad === null) ? (formatJson(fileText) || fileText) : fileText;
    $('tabs').style.display = 'flex';
    $('drop').style.display = 'none';
    if (bad !== null) {
      var m = $('msg');
      m.className = 'banner error';
      m.textContent = 'This file is not valid JSON, so there is no table to show (' + bad + '). It is displayed as it is under Code.';
      m.style.display = '';
      api = null;
      $('tree').innerHTML = '';
      show('code');
      return;
    }
    $('msg').style.display = 'none';
    api = buildJsonTable($('tree'), data);
    $('q').value = '';
    $('qinfo').textContent = api ? (api.count + ' nodes') : '';
    show('tree');
  }

  function readFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { load(String(r.result), f.name + '  (' + f.size + ' bytes)'); };
    r.onerror = function () {
      var m = $('msg'); m.className = 'banner error'; m.style.display = '';
      m.textContent = 'Could not read the file.';
    };
    r.readAsText(f, 'UTF-8');
  }
  $('jsonFile').addEventListener('change', function (e) { readFile(e.target.files[0]); });

  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
  });
  document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) drop.classList.remove('drag'); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); drop.classList.remove('drag');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
  });
})();
</script>
</body>
</html>
